<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#1B3A4B"/>
  <!-- Blueprint Grid -->
  <g stroke="#7FB7BE" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.3">
    <path d="M0 100h800M0 200h800M0 300h800M0 400h800M0 500h800"/>
    <path d="M100 0v600M200 0v600M300 0v600M400 0v600M500 0v600M600 0v600M700 0v600"/>
  </g>
  <!-- Building Outline -->
  <rect x="150" y="100" width="500" height="400" fill="#0F2531" stroke="#7FB7BE" stroke-width="4" rx="8"/>
  <!-- Interior Rooms -->
  <line x1="150" y1="280" x2="650" y2="280" stroke="#7FB7BE" stroke-width="3"/>
  <line x1="400" y1="100" x2="400" y2="500" stroke="#7FB7BE" stroke-width="3"/>
  <line x1="280" y1="280" x2="280" y2="500" stroke="#7FB7BE" stroke-width="2"/>
  <line x1="520" y1="100" x2="520" y2="280" stroke="#7FB7BE" stroke-width="2"/>
  
  <!-- Balcony / Terraza -->
  <rect x="150" y="70" width="500" height="30" fill="none" stroke="#7FB7BE" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="400" y="55" fill="#EDE6DA" font-family="sans-serif" font-size="14" text-anchor="middle" letter-spacing="2">BALCÓN TERRAZA</text>
  
  <!-- Labels -->
  <text x="275" y="200" fill="#EDE6DA" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">LIVING / COMEDOR</text>
  <text x="585" y="200" fill="#EDE6DA" font-family="sans-serif" font-size="16" text-anchor="middle">COCINA</text>
  <text x="215" y="400" fill="#EDE6DA" font-family="sans-serif" font-size="16" text-anchor="middle">DORMITORIO 1</text>
  <text x="340" y="400" fill="#EDE6DA" font-family="sans-serif" font-size="16" text-anchor="middle">DORMITORIO 2</text>
  <text x="525" y="400" fill="#EDE6DA" font-family="sans-serif" font-size="16" text-anchor="middle">SUITE PRINCIPAL</text>
  
  <!-- Stamp / Title Block -->
  <rect x="520" y="430" width="220" height="150" fill="#1B3A4B" stroke="#7FB7BE" stroke-width="2"/>
  <text x="630" y="460" fill="#7FB7BE" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">VICTOR HUGO UNO</text>
  <text x="630" y="485" fill="#EDE6DA" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">PLANTA PISO 1</text>
  <text x="630" y="510" fill="#A3D2D6" font-family="sans-serif" font-size="12" text-anchor="middle">PINAMAR - OSTENDE</text>
  <text x="630" y="550" fill="#7FB7BE" font-family="sans-serif" font-size="10" text-anchor="middle" opacity="0.8">BOCETO ARQUITECTÓNICO PRELIMINAR</text>
</svg>
